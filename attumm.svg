      <text class="cmd" x="29.6" y="406" clip-path="url(#tc10)">python -c "import this"</text>
      <text class="info" x="14" y="428">The Zen of Python, by Tim Peters</text>
      <text class="info" x="14" y="450">Beautiful is better than ugly.</text>
      <text class="info" x="14" y="472">Simple is better than complex.</text>
      <text class="info" x="14" y="494">Readability counts.</text>
      <text class="info" x="14" y="516">Errors should never pass silently.</text>
      <text class="info" x="14" y="538">Now is better than never.</text>
      <text class="info" x="14" y="560">Namespaces are one honking great idea!</text>
      <text class="heart" x="14" y="582">Although that way may not be obvious at first unless you're Dutch.</text>

